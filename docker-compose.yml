# Local development stack: `docker compose up -d postgres redis minio` then `pnpm dev`,
# or `docker compose --profile app up --build` to run everything in containers.
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: jobia, POSTGRES_PASSWORD: jobia, POSTGRES_DB: jobia }
    ports: ["5432:5432"]
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "jobia"], interval: 5s }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio123 }
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      sh -c "sleep 3 && mc alias set local http://minio:9000 minio minio123 && mc mb -p local/jobia-cvs"

  api:
    profiles: [app]
    build: { context: ., dockerfile: infra/docker/node.Dockerfile, target: api, args: { APP: api } }
    env_file: .env
    environment:
      DATABASE_URL: postgres://jobia:jobia@postgres:5432/jobia
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    ports: ["4000:4000"]
    depends_on: [postgres, redis, minio]

  worker-ai:
    profiles: [app]
    build: { context: ., dockerfile: infra/docker/node.Dockerfile, target: worker, args: { APP: worker } }
    env_file: .env
    environment:
      DATABASE_URL: postgres://jobia:jobia@postgres:5432/jobia
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      WORKER_QUEUES: cv.parse,match,inbox.sync,scheduler
    depends_on: [postgres, redis]

  worker-browser:
    profiles: [app]
    build: { context: ., dockerfile: infra/docker/node.Dockerfile, target: worker, args: { APP: worker } }
    env_file: .env
    shm_size: 1gb
    environment:
      DATABASE_URL: postgres://jobia:jobia@postgres:5432/jobia
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      WORKER_QUEUES: discovery,submit
    depends_on: [postgres, redis]

  web:
    profiles: [app]
    build: { context: ., dockerfile: infra/docker/web.Dockerfile, args: { NEXT_PUBLIC_API_URL: http://localhost:4000 } }
    ports: ["3000:3000"]

volumes:
  pg: {}
  minio: {}
