# Stateless API: scales horizontally on CPU. JWT auth means no sticky sessions.
apiVersion: apps/v1
kind: Deployment
metadata: { name: jobia-api, namespace: jobia }
spec:
  replicas: 6
  selector: { matchLabels: { app: jobia-api } }
  strategy: { rollingUpdate: { maxUnavailable: 0, maxSurge: 25% } }
  template:
    metadata: { labels: { app: jobia-api } }
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: jobia-api } } }
      containers:
        - name: api
          image: ghcr.io/jobia/api:latest
          ports: [{ containerPort: 4000 }]
          envFrom: [{ secretRef: { name: jobia-secrets } }, { configMapRef: { name: jobia-config } }]
          env:
            # Through PgBouncer (transaction pooling): many pods × small pools stay under Postgres' limit.
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: jobia-secrets, key: DATABASE_POOLER_URL } } }
            - { name: DATABASE_POOL_SIZE, value: "10" }
          resources:
            requests: { cpu: 500m, memory: 384Mi }
            limits: { memory: 768Mi }
          readinessProbe: { httpGet: { path: /health/ready, port: 4000 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health/live, port: 4000 }, periodSeconds: 10 }
          lifecycle: { preStop: { sleep: { seconds: 5 } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: jobia-api, namespace: jobia }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: jobia-api }
  minReplicas: 6
  maxReplicas: 80
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: jobia-api, namespace: jobia }
spec:
  minAvailable: 70%
  selector: { matchLabels: { app: jobia-api } }
---
apiVersion: v1
kind: Service
metadata: { name: jobia-api, namespace: jobia }
spec:
  selector: { app: jobia-api }
  ports: [{ port: 80, targetPort: 4000 }]
