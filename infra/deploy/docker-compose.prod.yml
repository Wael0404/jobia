# Production stack for a single VM (e.g. Oracle Cloud "Always Free" Ampere, 4 vCPU / 24 GB).
#   cd infra/deploy && docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Everything is served on ONE domain by Caddy (automatic HTTPS):
#   /v1/*, /health/*  → api      /jobia-cvs/*  → minio (presigned CV uploads)      /*  → web
name: jobia

x-node-env: &node-env
  NODE_ENV: production
  DATABASE_URL: postgres://jobia:${POSTGRES_PASSWORD}@postgres:5432/jobia
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: jobia-cvs
  S3_ACCESS_KEY_ID: jobia
  S3_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
  VAULT_MASTER_KEY: ${VAULT_MASTER_KEY}
  FEATURE_LINKEDIN_AUTOMATION: ${FEATURE_LINKEDIN_AUTOMATION:-false}

x-restart: &restart
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

services:
  caddy:
    <<: *restart
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN}", ACME_EMAIL: "${ACME_EMAIL}" }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, web, minio]

  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment: { POSTGRES_USER: jobia, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: jobia }
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "jobia"], interval: 5s, retries: 20 }

  redis:
    <<: *restart
    image: redis:7-alpine
    # BullMQ requires noeviction; AOF keeps queued jobs across restarts.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"], interval: 5s, retries: 20 }

  minio:
    <<: *restart
    image: minio/minio:latest
    command: server /data
    environment: { MINIO_ROOT_USER: jobia, MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD}" }
    volumes: [minio-data:/data]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 5s, retries: 20 }

  minio-init:
    image: minio/mc:latest
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: ["sh", "-c", "mc alias set local http://minio:9000 jobia \"$$MINIO_PASSWORD\" && mc mb -p local/jobia-cvs && mc anonymous set none local/jobia-cvs"]
    environment: { MINIO_PASSWORD: "${MINIO_PASSWORD}" }

  migrate:
    build: { context: ../.., dockerfile: infra/docker/node.Dockerfile, target: api, args: { APP: api } }
    image: jobia-api:latest
    command: ["node", "dist/migrate.js"]
    environment: { DATABASE_URL: "postgres://jobia:${POSTGRES_PASSWORD}@postgres:5432/jobia", MIGRATIONS_DIR: /app/drizzle }
    depends_on: { postgres: { condition: service_healthy } }

  api:
    <<: *restart
    image: jobia-api:latest
    environment:
      <<: *node-env
      PORT: "4000"
      PUBLIC_API_URL: https://${DOMAIN}
      WEB_ORIGIN: https://${DOMAIN}
      S3_PUBLIC_ENDPOINT: https://${DOMAIN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  worker-ai:
    <<: *restart
    build: { context: ../.., dockerfile: infra/docker/node.Dockerfile, target: worker, args: { APP: worker } }
    image: jobia-worker:latest
    environment:
      <<: *node-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      WORKER_QUEUES: cv.parse,match,inbox.sync,scheduler
      LLM_CONCURRENCY: "5"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker-browser:
    <<: *restart
    image: jobia-worker:latest
    shm_size: 1gb
    environment:
      <<: *node-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      WORKER_QUEUES: discovery,submit
      BROWSER_CONCURRENCY: "3"
      AGENT_MAX_APPLICATIONS_PER_DAY: ${AGENT_MAX_APPLICATIONS_PER_DAY:-20}
    depends_on: [worker-ai]

  web:
    <<: *restart
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args: { NEXT_PUBLIC_API_URL: "https://${DOMAIN}" }
    image: jobia-web:latest

volumes:
  caddy-data: {}
  caddy-config: {}
  pg-data: {}
  redis-data: {}
  minio-data: {}
